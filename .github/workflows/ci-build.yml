name: ci-build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hireflow_test
          POSTGRES_PASSWORD: hireflow_test
          POSTGRES_DB: hireflow_checkout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hireflow_test -d hireflow_checkout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checkout concurrency and ownership tests
        env:
          DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
          CHECKOUT_POSTGRES_TEST_DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
        run: node --test backend/src/routes/paddleCheckout.postgres.test.js

      - name: Subscription lifecycle PostgreSQL tests
        env:
          DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
          LIFECYCLE_POSTGRES_TEST_DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
        run: node --test backend/src/services/paddleSubscriptionLifecycle.postgres.test.js

      - name: Paddle billing readiness PostgreSQL tests
        env:
          DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
          BILLING_READINESS_POSTGRES_TEST_DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
        run: node --test backend/src/services/paddleBillingReadiness.postgres.test.js

      - name: Resume quota PostgreSQL concurrency tests
        env:
          DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
          RESUME_QUOTA_POSTGRES_TEST_DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
        run: node --test backend/src/services/resumeQuotaReservations.postgres.test.js

      - name: Paddle webhook transaction and worker PostgreSQL tests
        env:
          DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
          PADDLE_WEBHOOK_POSTGRES_TEST_DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
        run: node --test backend/src/routes/paddleWebhook.postgres.test.js

      - name: Automatic Paddle reconciliation PostgreSQL tests
        env:
          DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
          PADDLE_RECONCILIATION_POSTGRES_TEST_DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
        run: node --test backend/src/services/paddleSubscriptionReconciliationWorker.postgres.test.js

      - name: Admin console PostgreSQL compatibility tests
        env:
          DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
          ADMIN_CONSOLE_POSTGRES_TEST_DATABASE_URL: postgresql://hireflow_test:hireflow_test@127.0.0.1:5432/hireflow_checkout_test
        run: node --test backend/src/routes/admin/adminSqlCompatibility.postgres.test.js

      - name: Build
        run: npm run build
